services:
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
    container_name: redroid
    privileged: true
    ports:
      - "5555:5555"          # ADB
    volumes:
      - ./redroid-data:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest   # software GPU; set to 'host' only if the VPS has a real GPU + drivers
    restart: unless-stopped

  webscreen:
    build:
      context: .
      dockerfile: wsscrcpy.Dockerfile
    container_name: webscreen
    depends_on:
      - redroid
    ports:
      - "8080:8000"          # browser stream client -> host :8080
    environment:
      - REDROID_ADB=redroid:5555
    restart: unless-stopped
