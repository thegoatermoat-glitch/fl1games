# Render deployment blueprint for fl1nt g4m3s
# Backend: FastAPI web service (proxies + serves the games API)
# Frontend: static React site
#
# Prerequisite: a MongoDB connection string (e.g. MongoDB Atlas free tier).
# Set MONGO_URL in the backend service env after creating it.

services:
  # ---------- Backend API ----------
  - type: web
    name: fl1nt-games-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        sync: false          # set this to your MongoDB Atlas connection string
      - key: DB_NAME
        value: fl1nt_games
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ---------- Frontend static site ----------
  - type: web
    name: fl1nt-games-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "yarn install && yarn build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false          # set this to the fl1nt-games-api URL after it deploys
    routes:
      # SPA fallback. Static files (including /cloud/*) are served first;
      # only unmatched routes fall through to index.html.
      - type: rewrite
        source: "/*"
        destination: "/index.html"
